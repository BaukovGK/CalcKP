# CI + деплой по SSH.
#
# Тесты (frontend, backend) и проверка ссылок на код в документах — на каждый
# push и pull request.
# Деплой — только при push в master, после зелёных тестов и только когда
# заведены секреты сервера (без них задача пропускается, а не падает):
#   на сервере git fetch + reset --hard + docker compose up -d --build (стек проверен, см.
#   docker-compose.yml), и деплой ждёт, пока бэкенд станет healthy.
#   Требуемые секреты репозитория перечислены в job deploy.

name: CI/CD

on:
  push:
  pull_request:

# Параллельные пуши в одну ветку не должны деплоить одновременно.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Фронт — typecheck + тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ntt-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ntt-calculator/package-lock.json
      - run: npm ci
      - run: npm run type-check
      # Проверяющий вариант линта: обычный `npm run lint` идёт с --fix и в CI
      # молча «чинил» бы код вместо того, чтобы падать.
      - run: npm run check:lint
      - run: npm test

  backend:
    name: Бэк — typecheck + миграции + сид
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ntt
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ntt_estimates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ntt -d ntt_estimates"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ntt:ci@localhost:5432/ntt_estimates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Тот же путь, что в проде (docker-entrypoint.sh): миграции применяются
      # с нуля. Ловит расхождение schema.prisma ↔ migrations до деплоя.
      - run: npx prisma migrate deploy
      # Дрейф схемы: `migrate deploy` применяет миграции, но НЕ проверяет, что
      # они описывают текущий schema.prisma. Правка схемы без миграции проходила
      # CI незамеченной и падала уже на проде. `migrate diff --exit-code` даёт
      # код 2, если между схемой и накатанной базой есть разница.
      #
      # Синтаксис Prisma 7: база — datasource из prisma.config.ts (DATABASE_URL
      # job'а), схема — файл. Прежние флаги --from-schema-datasource и
      # --to-schema-datamodel в Prisma 7 удалены: с ними шаг падал на каждом
      # пуше ошибкой разбора аргументов, и деплой не доходил до запуска.
      - name: Схема и миграции совпадают
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code
      # Сид на пустой базе — строго: любое расхождение с JSON здесь — ошибка
      # данных или ключей (prisma/seed.ts, SEED_STRICT).
      - run: npm run db:seed
        env:
          SEED_STRICT: '1'
      # Повторный сид на базе, где правили справочники, — как при каждом
      # старте контейнера: не падает и правок технолога не трогает
      # (doc/План_устранения.md, 0.1).
      - name: Повторный сид на изменённой базе
        run: node tools/seed-rerun-check.cjs
        env:
          SEED_RERUN_CHECK: '1'
      # tsc собирает src/** — компиляция без ошибок типов.
      - run: npm run build
      # Юнит-тесты чистых модулей (vitest) — не требуют БД.
      - run: npm test

  # Документы ссылаются на код по имени, а не по номеру строки: номера гниют
  # молча (doc/План_устранения.md, 4.2). Зависимостей у проверки нет — npm ci
  # не нужен.
  docs:
    name: Документы — ссылки на код без номеров строк
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-doc-refs.mjs

  # Заведены ли секреты выкладки. Отдельной задачей, потому что в `if` самой
  # задачи контекст `secrets` недоступен — только в шагах. Пока сервера нет,
  # деплой ПРОПУСКАЕТСЯ: прогон остаётся зелёным, и красный цвет продолжает
  # означать «что-то сломано», а не «сервер ещё не настроен».
  deploy-ready:
    name: Секреты выкладки заданы
    needs: [frontend, backend, docs]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        # Значения секретов сюда не попадают — только «заданы или нет».
        run: echo "ready=${{ secrets.DEPLOY_SSH_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Деплой на сервер (SSH)
    needs: [frontend, backend, docs, deploy-ready]
    if: needs.deploy-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: docker compose up на сервере
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # DEPLOY_PATH — каталог с репозиторием и .env на сервере.
          # .env НЕ в git: он создаётся на сервере один раз (см. .env.example).
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/master
            # Коммит сборки — в /api/health: по нему видно, что развёрнуто.
            export APP_BUILD="$(git rev-parse --short HEAD)"
            docker compose pull || true
            # --wait ждёт, пока сервисы поднимутся, а бэкенд пройдёт свой
            # healthcheck. Не прошёл за 3 минуты (упала миграция, сид, нет БД)
            # — деплой красный, а не зелёный (doc/План_устранения.md, 0.3).
            if ! docker compose up -d --build --remove-orphans --wait --wait-timeout 180; then
              echo "стек не поднялся за 3 минуты — хвост логов бэкенда:" >&2
              docker compose logs --tail=150 backend >&2
              exit 1
            fi
            docker image prune -f

# Тело сервера приложения: статика SPA, прокси /api, лимиты входа, кеш.
# Подключается и в HTTP-сервер (nginx.conf), и в HTTPS-сервер
# (nginx/https.conf) — содержимое одно, отличается только то, на каком порту
# и с каким протоколом его слушают. Зоны limit_req_zone объявлены в самих
# nginx.conf и nginx/https.conf: им место на уровне http, а не server.

root /usr/share/nginx/html;
index index.html;

# Прайс НН — ~1000 позиций, ответы крупные.
gzip on;
gzip_types application/json application/javascript text/css;
gzip_min_length 1024;

# Импорт прайса: мастер-шаблон весит 2,3 МБ; лимит multer на бэке — 25 МБ.
client_max_body_size 25m;

# Заголовки безопасности и CSP (Report-Only) — nginx/security-headers.conf.
# Не отправляем версию nginx в ответах.
server_tokens off;
include /etc/nginx/snippets/security-headers.conf;

# Заголовки прокси — на уровне сервера: их наследуют все location с
# proxy_pass ниже.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location /api/ {
    proxy_pass http://backend:3000;
    # Выгрузка xlsx и импорт могут идти дольше дефолтных 60с.
    proxy_read_timeout 120s;
}

# Вход: 10 в минуту с адреса, всплеск до 20 — офис за NAT входит утром
# разом. Сверх — 429 в том же JSON, что у приложения.
location = /api/auth/login {
    limit_req zone=auth_login burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many;
    proxy_pass http://backend:3000;
}

# Обновление токена: каждая вкладка — раз в 15 минут; 60 в минуту с
# адреса — только против потока запросов.
location = /api/auth/refresh {
    limit_req zone=auth_refresh burst=60 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many;
    proxy_pass http://backend:3000;
}

location @too_many {
    default_type 'application/json; charset=utf-8';
    include /etc/nginx/snippets/security-headers.conf;
    add_header Retry-After 60 always;
    return 429 '{"message":"Слишком много попыток — подождите минуту","code":"TOO_MANY_REQUESTS"}';
}

# SPA: любой маршрут отдаём index.html — роутинг на клиенте.
location / {
    try_files $uri $uri/ /index.html;
}

# index.html — без кеша (План_устранения 2.4): в нём ссылки на ассеты с
# хешами, и после выкладки браузер обязан взять новый, а не держать
# старый со ссылками на исчезнувшие файлы. Сюда же приходит фолбэк SPA.
location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Хеши в именах ассетов Vite — кешируем надолго.
location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
}

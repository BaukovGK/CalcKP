# Режим HTTPS (docker-compose.https.yml): TLS принимает сам nginx фронтенда,
# без второго прокси перед ним. Поэтому адрес клиента для лимитов входа —
# настоящий, и TRUST_PROXY остаётся 1.
#
# Скрипт nginx/40-tls.sh при старте контейнера кладёт этот файл на место
# conf.d/default.conf (вместо nginx.conf). Сертификат и ключ монтируются с
# хоста в /etc/nginx/tls: fullchain.pem (сертификат + промежуточные) и
# privkey.pem. В образ они не попадают.

# Те же зоны, что в nginx.conf: в режиме HTTPS тот файл не загружается.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=60r/m;

# 80 — только перевод на https. Проба /api/health остаётся на HTTP: её
# дёргают deploy/preflight.sh и deploy/autoupdate.sh по http://127.0.0.1.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /api/health {
        proxy_pass http://backend:3000;
    }

    # Перевод на стандартный 443: при HTTPS_PORT не 443 в адресе нужен порт,
    # а внутри контейнера внешний порт неизвестен — тогда заходите по https
    # сразу.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/app.conf;
}

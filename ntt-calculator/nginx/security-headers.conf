# Заголовки безопасности (План_устранения 2.4).
#
# Подключаются в server и в каждом location со своим add_header: nginx не
# наследует add_header в location, где объявлен свой, — без повторного
# include ассеты и index.html остались бы без них.
#
# __FRAME_ANCESTORS__ подставляет nginx/35-csp.sh при старте контейнера: из
# BITRIX_PORTAL — только портал компании, без него — любой облачный
# Битрикс24, как было.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Кто может показывать приложение во фрейме — уже в боевом режиме: эта часть
# CSP проверена вкладкой портала и ничего, кроме чужих фреймов, не задевает.
# Чужой сайт не встроит калькулятор в невидимый фрейм под клик пользователя,
# а чужой портал Битрикс24 — даже показать его. X-Frame-Options не ставится:
# он не умеет разрешать один внешний домен.
add_header Content-Security-Policy "frame-ancestors __FRAME_ANCESTORS__" always;

# Остальная CSP — пока в режиме Report-Only: браузер ничего не блокирует, а
# нарушения шлёт на /api/csp-report, и бэкенд пишет их в лог
# (`docker compose logs backend | grep CSP`). Когда за неделю работы лог
# чистый, заголовок переименовать в Content-Security-Policy.
#
#  - style-src 'unsafe-inline' — атрибуты style у Vue-шаблонов;
#  - шрифт Archivo лежит в сборке (`@fontsource/archivo`, src/assets/main.css),
#    поэтому сторонних доменов для стилей и шрифтов здесь нет;
#  - подключим библиотеку BX24 (ТЗ §10.2) — добавить в script-src
#    https://api.bitrix24.com.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors __FRAME_ANCESTORS__; report-uri /api/csp-report" always;

# Заголовки безопасности (План_устранения 2.4).
#
# Подключаются в server и в каждом location со своим add_header: nginx не
# наследует add_header в location, где объявлен свой, — без повторного
# include ассеты и index.html остались бы без них.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# CSP — пока в режиме Report-Only: нарушения видны в консоли браузера, но
# ничего не блокируется. Когда консоль будет чистой на всех экранах, заголовок
# переименовать в Content-Security-Policy.
#
#  - frame-ancestors — Битрикс24: приложение живёт во вкладке портала
#    (ТЗ §10.3), поэтому X-Frame-Options не ставится. Облачный портал другого
#    домена — дописать сюда;
#  - style-src 'unsafe-inline' — атрибуты style у Vue-шаблонов;
#  - шрифт Archivo лежит в сборке (`@fontsource/archivo`, src/assets/main.css),
#    поэтому сторонних доменов для стилей и шрифтов здесь нет;
#  - подключим библиотеку BX24 (ТЗ §10.2) — добавить в script-src
#    https://api.bitrix24.com.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.bitrix24.ru https://*.bitrix24.com" always;

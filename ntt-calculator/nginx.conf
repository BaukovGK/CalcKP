# ✅ Проверен: раздача SPA, роутинг и проксирование /api работают (2026-07-17).
#
# Режим по умолчанию — HTTP на 80. С HTTPS (docker-compose.https.yml) этот
# файл подменяется на nginx/https.conf скриптом nginx/40-tls.sh при старте
# контейнера. Сами location у обоих режимов общие — nginx/app.conf.

# Вход и обновление токена — не чаще, чем нужно человеку: подбор пароля
# упирается в 429 (План_устранения 2.2). Ключ — адрес клиента; второй рубеж,
# по адресу почты, — в приложении (backend/src/utils/rate-limit.ts). Стоит
# перед nginx ещё прокси — адрес клиента нужно восстановить модулем realip,
# иначе все клиенты для лимита — один.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app.conf;
}

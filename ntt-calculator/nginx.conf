# ✅ Проверен: раздача SPA, роутинг и проксирование /api работают (2026-07-17).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Прайс НН — ~1000 позиций, ответы крупные.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Импорт прайса: мастер-шаблон весит 2,3 МБ; лимит multer на бэке — 25 МБ.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Выгрузка xlsx и импорт могут идти дольше дефолтных 60с.
        proxy_read_timeout 120s;
    }

    # SPA: любой маршрут отдаём index.html — роутинг на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хеши в именах ассетов Vite — кешируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Работа внутри iframe Битрикс24 (ТЗ §10.3): X-Frame-Options НЕ ставим,
    # ограничиваем через frame-ancestors. Подставьте домен портала.
    # add_header Content-Security-Policy "frame-ancestors https://*.bitrix24.ru https://*.bitrix24.com";
}

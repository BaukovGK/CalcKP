# ✅ Проверен: раздача SPA, роутинг и проксирование /api работают (2026-07-17).

# Вход и обновление токена — не чаще, чем нужно человеку: подбор пароля
# упирается в 429 (План_устранения 2.2). Ключ — адрес клиента; второй рубеж,
# по адресу почты, — в приложении (backend/src/utils/rate-limit.ts). Стоит
# перед nginx ещё прокси — адрес клиента нужно восстановить модулем realip,
# иначе все клиенты для лимита — один.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Прайс НН — ~1000 позиций, ответы крупные.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Импорт прайса: мастер-шаблон весит 2,3 МБ; лимит multer на бэке — 25 МБ.
    client_max_body_size 25m;

    # Заголовки прокси — на уровне сервера: их наследуют все location с
    # proxy_pass ниже.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:3000;
        # Выгрузка xlsx и импорт могут идти дольше дефолтных 60с.
        proxy_read_timeout 120s;
    }

    # Вход: 10 в минуту с адреса, всплеск до 20 — офис за NAT входит утром
    # разом. Сверх — 429 в том же JSON, что у приложения.
    location = /api/auth/login {
        limit_req zone=auth_login burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        proxy_pass http://backend:3000;
    }

    # Обновление токена: каждая вкладка — раз в 15 минут; 60 в минуту с
    # адреса — только против потока запросов.
    location = /api/auth/refresh {
        limit_req zone=auth_refresh burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        proxy_pass http://backend:3000;
    }

    location @too_many {
        default_type 'application/json; charset=utf-8';
        add_header Retry-After 60 always;
        return 429 '{"message":"Слишком много попыток — подождите минуту","code":"TOO_MANY_REQUESTS"}';
    }

    # SPA: любой маршрут отдаём index.html — роутинг на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хеши в именах ассетов Vite — кешируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Работа внутри iframe Битрикс24 (ТЗ §10.3): X-Frame-Options НЕ ставим,
    # ограничиваем через frame-ancestors. Подставьте домен портала.
    # add_header Content-Security-Policy "frame-ancestors https://*.bitrix24.ru https://*.bitrix24.com";
}

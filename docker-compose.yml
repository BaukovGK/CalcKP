# ✅ ПРОВЕРЕН на Docker 29.6.1 / Compose v5.3.0 (2026-07-17): `docker compose up`
# поднимает стек с нуля — миграции, сид (1040 позиций прайса), логин, выпуск КП
# и UI через nginx работают.
#
# Схема (ТЗ §10.1): nginx (отдаёт собранный фронт, проксирует /api)
#                   → backend (Express :3000) → PostgreSQL 16
#
# Запуск:  cp .env.example .env   (заполнить POSTGRES_PASSWORD и JWT_SECRET)
#          docker compose up --build
#
# Альтернатива без Docker — ./verify.ps1 (тоже проверен).

# Имя проекта задано явно: Compose выводит его из имени каталога, а каталог
# называется «сметы» — кириллица вычищается, остаётся пустая строка, и
# `docker compose config` падает с «project name must not be empty».
name: ntt-calculator

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ntt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-ntt_estimates}
      # Кодировка UTF8 обязательна: наименования прайса кириллические.
      # Локаль — C.UTF-8, а НЕ ru_RU.utf8: последней в образе postgres:16 нет
      # (её пришлось бы генерировать), initdb падает с «invalid locale
      # settings» и контейнер уходит в цикл рестарта. Проверено запуском.
      # На хранение кириллицы локаль не влияет — только на сортировку;
      # если понадобится русская коллация в ORDER BY, нужен свой образ
      # с locale-gen ru_RU.UTF-8.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # backend стартует только после готовности БД: иначе migrate deploy
      # упадёт на первом же запуске.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ntt} -d ${POSTGRES_DB:-ntt_estimates}']
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Коммит сборки — в /api/health (План_устранения 3.8). Деплой задаёт его
      # сам (.github/workflows/ci-cd.yml), вручную:
      #   APP_BUILD=$(git rev-parse --short HEAD) docker compose up -d --build
      args:
        APP_BUILD: ${APP_BUILD:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ntt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ntt_estimates}
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET обязателен}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      # Фронт отдаётся тем же nginx, поэтому запросы идут с его origin.
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      # Дамп снимается ДО применения миграций: у `prisma migrate deploy`
      # обратного хода нет, и восстановление из дампа — единственный путь назад.
      # `require` (по умолчанию) означает «не снялся дамп — не стартуем».
      BACKUP_BEFORE_MIGRATE: ${BACKUP_BEFORE_MIGRATE:-require}
      BACKUP_DIR: /backups
      # Сколько дампов каждого вида хранить: ручных, предмиграционных,
      # страховочных и загруженных — отдельно (План_устранения 3.4).
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      # Демо-учётки остальных ролей. По умолчанию сид заводит только
      # администратора — остальные пользователи создаются вручную.
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-0}
      # Пароль первого администратора (не короче 8 знаков). Пусто — сид
      # сгенерирует случайный и один раз напечатает его в лог. В обоих
      # случаях при первом входе пароль обязательно сменить.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # Сколько прокси перед бэкендом: адрес клиента для лимита входа берётся
      # из X-Forwarded-For. 1 — nginx этого compose; поставили ещё прокси
      # (TLS, балансировщик) — 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      # Дампы лежат на хосте, а не в томе: их надо уметь забрать с машины,
      # а том исчезнет вместе с `docker compose down -v`.
      - ./backups:/backups
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

  # Ручной бэкап. Со стеком не поднимается — только по требованию:
  #
  #   docker compose --profile tools run --rm backup
  #
  # Образ postgres:16 взят намеренно: мажорная версия pg_dump обязана совпадать
  # с сервером, иначе дамп не снимется.
  backup:
    image: postgres:16
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment: &backup-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-ntt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ntt_estimates}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes: &backup-volumes
      - ./backups:/backups
      - ./backend/scripts:/scripts:ro
    entrypoint: ['/scripts/db-backup.sh']

  # Восстановление — отдельным сервисом, а не флагом к предыдущему: операция
  # разрушающая, и запускать её нужно осознанно, целиком написав команду.
  #
  #   docker compose --profile tools run --rm restore --list
  #   docker compose --profile tools run --rm restore --yes latest
  #
  # Перед заменой скрипт сам снимает страховочный дамп текущего состояния.
  restore:
    image: postgres:16
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backup-env
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./backups:/backups
      - ./backend/scripts:/scripts:ro
      # Миграции программы: скрипт сверяет с ними миграции дампа — дамп новее
      # программы не восстанавливается (План_устранения 3.3).
      - ./backend/prisma/migrations:/migrations:ro
    entrypoint: ['/scripts/db-restore.sh']

  web:
    build:
      context: .
      dockerfile: ./ntt-calculator/Dockerfile
      args:
        # Фронт ходит на /api того же origin — nginx проксирует.
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  db-data:
